providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @land-intelligence/database run db:generate", "pnpm --filter @land-intelligence/web build"]

[start]
cmd = "node .next/standalone/apps/web/server.js"
