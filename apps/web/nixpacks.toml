providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @land-intelligence/database run db:generate", "pnpm --filter @land-intelligence/web build", "mkdir -p .next/standalone/apps/web/.next", "cp -r .next/static .next/standalone/apps/web/.next/"]

[start]
cmd = "HOSTNAME=0.0.0.0 node .next/standalone/apps/web/server.js"
