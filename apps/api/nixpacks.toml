providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = ["pnpm --filter @land-intelligence/database run db:generate", "pnpm --filter @land-intelligence/api build"]

[start]
cmd = "pnpm --filter @land-intelligence/api start"
