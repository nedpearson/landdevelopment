providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs-20_x", "pnpm-8_x"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = ["pnpm --filter @land-intelligence/database run db:generate", "pnpm build"]

[start]
cmd = "pnpm --filter @land-intelligence/database run db:deploy && pnpm --filter @land-intelligence/web start"
