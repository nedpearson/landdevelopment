[providers]
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs-20_x", "pnpm-9_x", "openssl"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @land-intelligence/database run db:generate",
  "pnpm run build"
]

[start]
cmd = "pnpm --filter @land-intelligence/api start"
