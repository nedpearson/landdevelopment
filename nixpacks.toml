providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "pnpm"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @land-intelligence/database run db:generate", "pnpm build", "mkdir -p apps/web/.next/standalone/apps/web/.next", "cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/"]

[start]
cmd = "HOSTNAME=0.0.0.0 node apps/web/.next/standalone/apps/web/server.js"
